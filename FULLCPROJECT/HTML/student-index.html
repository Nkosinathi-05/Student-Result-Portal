<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIN</title>
    <link rel="stylesheet" href="../CSS/Student-result-portal.css" />
  </head>
  <body>
    <div class="bg-image"></div>
    <div class="logInContainer">
      <div class="student-details-input">
        <h2>STUDENT LOGIN</h2>
        <input
          type="text"
          name="student-identity"
          id="js-student-identity"
          placeholder="Type student number here.."
        />
        <button onclick="logIn()" class="login-btn">LOGIN</button>
      </div>
      <div class="loginOutput"></div>
    </div>

    <script src="../JAVASCRIPT/Student-result-portal.js"></script>
  </body>
</html>
